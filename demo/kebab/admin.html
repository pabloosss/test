<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel zamówień demo | KebabKing</title>
  <style>
    :root{--red:#d71920;--yellow:#ffbc0d;--ink:#1c120d;--muted:#756154;--paper:#fffdf7;--soft:#f5ead6;--line:#eadfcd;--green:#208a3a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff6df;color:var(--ink)}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.top .wrap{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.logo{font-size:24px;font-weight:900;color:var(--red);text-decoration:none}.btn,button{border:0;border-radius:999px;padding:11px 15px;background:var(--yellow);font-weight:900;color:var(--ink);text-decoration:none;cursor:pointer;display:inline-block}.dark{background:var(--ink);color:#fff}.danger{background:#ffe0e0;color:#a81017}.main{padding:28px 0 90px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.order,.empty{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 32px #0001}.stat span{display:block;color:var(--muted);font-weight:800}.stat strong{display:block;margin-top:6px;font-size:1.7rem}.orders{display:grid;gap:14px}.order-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:var(--soft);font-weight:900}.paid{background:#e8f8ee;color:var(--green)}.wait{background:#fff0c2;color:#8a4b00}.cancel{background:#ffe0e0;color:#a81017}.order pre{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px;line-height:1.45}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px}select{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px}.note{background:#fff0c2;border:1px solid #e7c96a;border-radius:18px;padding:14px;margin:16px 0;color:#5d3b00;font-weight:700}@media(max-width:850px){.grid,.forms{grid-template-columns:1fr}.order-head{display:grid}}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="index.html">KebabKing Admin</a>
      <nav>
        <a class="btn dark" href="index.html">Strona</a>
        <button class="danger" id="clearOrders" type="button">Wyczyść zamówienia</button>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    <h1>Panel zamówień demo</h1>
    <p class="note">To panel statyczny do portfolio. Zamówienia zapisują się w tej przeglądarce przez localStorage, bez PHP i bez serwera.</p>

    <section class="grid">
      <div class="stat"><span>Wszystkie</span><strong id="totalOrders">0</strong></div>
      <div class="stat"><span>Nowe</span><strong id="newOrders">0</strong></div>
      <div class="stat"><span>Opłacone</span><strong id="paidOrders">0</strong></div>
      <div class="stat"><span>Ostatnie</span><strong id="lastOrder">—</strong></div>
    </section>

    <section class="orders" id="ordersList"></section>
  </main>

  <script>
    const ORDER_KEY = 'kebabDemoOrders';
    const statusList = ['nowe', 'przyjęte', 'w realizacji', 'gotowe', 'odebrane', 'anulowane'];
    const paymentStatusList = ['płatność przy odbiorze', 'oczekuje na płatność', 'opłacone', 'nieudane', 'zwrot'];

    const readOrders = () => {
      try { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); }
      catch { return []; }
    };
    const saveOrders = (orders) => localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
    const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    function badgeClass(value) {
      if (value === 'opłacone') return 'paid';
      if (value === 'oczekuje na płatność') return 'wait';
      if (value === 'anulowane' || value === 'nieudane') return 'cancel';
      return '';
    }

    function updateOrder(id, field, value) {
      const orders = readOrders();
      const order = orders.find((item) => item.id === id);
      if (!order) return;
      order[field] = value;
      order.updated_at = new Date().toLocaleString('pl-PL');
      if (field === 'payment_status') order.paid = value === 'opłacone';
      saveOrders(orders);
      render();
    }

    function render() {
      const orders = readOrders();
      document.querySelector('#totalOrders').textContent = orders.length;
      document.querySelector('#newOrders').textContent = orders.filter((o) => o.status === 'nowe').length;
      document.querySelector('#paidOrders').textContent = orders.filter((o) => o.paid).length;
      document.querySelector('#lastOrder').textContent = orders[0]?.created_at || '—';

      const list = document.querySelector('#ordersList');
      if (!orders.length) {
        list.innerHTML = '<div class="empty"><h2>Brak zamówień</h2><p>Wróć na stronę, złóż testowe zamówienie i odśwież panel.</p></div>';
        return;
      }

      list.innerHTML = orders.map((order) => `
        <article class="order">
          <div class="order-head">
            <div>
              <h2>${escapeHtml(order.id)}</h2>
              <p>${escapeHtml(order.created_at)} · ${escapeHtml(order.total)}</p>
            </div>
            <div class="badges">
              <span class="badge ${badgeClass(order.status)}">${escapeHtml(order.status)}</span>
              <span class="badge ${badgeClass(order.payment_status)}">${escapeHtml(order.payment_status)}</span>
            </div>
          </div>
          <p><b>${escapeHtml(order.name)}</b> · tel. ${escapeHtml(order.phone)} · ${escapeHtml(order.mode)} · ${escapeHtml(order.payment_method)}</p>
          ${order.address ? `<p><b>Adres:</b> ${escapeHtml(order.address)}</p>` : ''}
          <pre>${escapeHtml(order.order_text)}</pre>
          <div class="forms">
            <select data-id="${escapeHtml(order.id)}" data-field="status">
              ${statusList.map((status) => `<option value="${status}" ${order.status === status ? 'selected' : ''}>${status}</option>`).join('')}
            </select>
            <select data-id="${escapeHtml(order.id)}" data-field="payment_status">
              ${paymentStatusList.map((status) => `<option value="${status}" ${order.payment_status === status ? 'selected' : ''}>${status}</option>`).join('')}
            </select>
          </div>
        </article>
      `).join('');

      list.querySelectorAll('select').forEach((select) => {
        select.addEventListener('change', () => updateOrder(select.dataset.id, select.dataset.field, select.value));
      });
    }

    document.querySelector('#clearOrders').addEventListener('click', () => {
      if (confirm('Wyczyścić wszystkie zamówienia demo?')) {
        localStorage.removeItem(ORDER_KEY);
        render();
      }
    });

    render();
  </script>
</body>
</html>
